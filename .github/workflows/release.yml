# Push a tag like v1.0.0 -> builds the helper and attaches AutoDuck.Helper-win-x64.zip to a GitHub Release.
name: Release helper
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (self-contained, no runtime needed on the user's PC)
        run: dotnet publish helper -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Package
        run: |
          Copy-Item scripts\*.ps1 publish\
          Compress-Archive -Path publish\* -DestinationPath AutoDuck.Helper-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: AutoDuck.Helper-win-x64.zip
